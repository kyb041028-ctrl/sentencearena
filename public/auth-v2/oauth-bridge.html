<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 연결 중 — 센텐스아레나</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e8eefc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .box {
      max-width: 28rem;
      padding: 1.5rem;
      border-radius: 12px;
      background: #121a33;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    a { color: #38bdf8; }
    .err { color: #fecaca; }
  </style>
</head>
<body>
  <div class="box" id="msg"></div>
  <script src="/auth-copy.js"></script>
  <script>
    (function () {
      var SID_KEY = 'sc_oauth_sid';
      var VERIFIER_KEY = 'sc_oauth_verifier';
      var el = document.getElementById('msg');
      function say(code) {
        var text = window.ScAuthCopy && window.ScAuthCopy.text ? window.ScAuthCopy.text(code) : code;
        if (el) el.textContent = text;
        document.documentElement.lang = window.ScAuthCopy && window.ScAuthCopy.region && window.ScAuthCopy.region() === 'US' ? 'en' : 'ko';
      }
      function fail(code) {
        var text = window.ScAuthCopy && window.ScAuthCopy.text ? window.ScAuthCopy.text(code) : code;
        var home = window.ScAuthCopy && window.ScAuthCopy.text ? window.ScAuthCopy.text('CALLBACK_HOME') : '처음으로';
        el.textContent = '';
        var err = document.createElement('p');
        err.className = 'err';
        err.textContent = text;
        var codeLine = document.createElement('p');
        codeLine.textContent = code;
        var back = document.createElement('p');
        var link = document.createElement('a');
        link.href = '/';
        link.textContent = home;
        back.appendChild(link);
        el.appendChild(err);
        el.appendChild(codeLine);
        el.appendChild(back);
      }
      say('OAUTH_BRIDGE_WAIT');
      try {
        var raw = String(window.location.hash || '').replace(/^#/, '');
        var params = new URLSearchParams(raw);
        var sid = params.get('sid') || '';
        var verifier = params.get('v') || '';
        var target = params.get('target') || '';
        if (!sid || !target || !verifier) {
          fail('OAUTH_BRIDGE_PARAMS');
          return;
        }
        try {
          sessionStorage.setItem(SID_KEY, sid);
          sessionStorage.setItem(VERIFIER_KEY, verifier);
        } catch (_) {}
        window.location.replace(target);
      } catch (e) {
        fail('OAUTH_BRIDGE_FAILED');
      }
    })();
  </script>
</body>
</html>
