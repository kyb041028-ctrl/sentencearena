<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>댓글 관리 · 센텐스아레나</title>
  <link rel="stylesheet" href="/admin/daily-issues/admin-daily-issue.css">
  <link rel="stylesheet" href="/admin/admin-shell.css">
  <style>
    .ac-field { display: block; width: 100%; margin: 8px 0; }
    .ac-field input, .ac-field select, .ac-field textarea { width: 100%; box-sizing: border-box; }
    .ac-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .ac-card { margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav id="sc-admin-nav" class="sc-admin-nav" aria-label="관리자 메뉴"></nav>
  <main class="sc-card" style="max-width: 960px; margin: 24px auto; padding: 20px;">
    <h1 class="sc-section-title">댓글 관리</h1>
    <p class="muted">댓글·대댓글을 찾아 확인하고 숨김·복구·작성자 제재를 합니다. 숨김과 제재는 따로 고릅니다. 조치 사유와 메모는 운영 이력에 남습니다.</p>
    <p id="ac-status" class="muted"></p>
    <form id="ac-search">
      <label class="ac-field">댓글 ID / 게시글 ID / 작성자 ID / 본문 일부
        <input id="ac-q" type="text" maxlength="120">
      </label>
      <button type="submit" class="sc-btn">검색</button>
    </form>
    <div id="ac-list"></div>
    <div id="ac-detail"></div>
  </main>
  <script src="/admin/admin-shell.js"></script>
  <script src="/admin/comments/admin-comments.js"></script>
</body>
</html>
