<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>데일리 이슈 검수 · 관리자</title>
  <link rel="stylesheet" href="/admin/daily-issues/admin-daily-issue.css" />
  <link rel="stylesheet" href="/admin/admin-shell.css" />
</head>
<body class="sc-admin-daily-issue-body">
  <nav id="sc-admin-nav" class="sc-admin-nav" aria-label="관리자 메뉴"></nav>
  <a class="sc-admin-daily-issue-skip" href="#sc-admin-daily-issue-main">본문으로 건너뛰기</a>

  <div id="sc-admin-daily-issue-app" class="sc-admin-daily-issue-app" hidden>
    <header class="sc-admin-daily-issue-header">
      <div class="sc-admin-daily-issue-header-titles">
        <h1 class="sc-admin-daily-issue-title">데일리 이슈 검수</h1>
        <p class="sc-admin-daily-issue-subtitle">관리자 검수 · 아침판 운영</p>
      </div>
      <div class="sc-admin-daily-issue-header-actions">
        <label class="sc-admin-daily-issue-field">
          <span>상태</span>
          <select id="sc-admin-daily-issue-filter-status" aria-label="상태 필터">
            <option value="">전체</option>
            <option value="READY_FOR_REVIEW">검수 필요</option>
            <option value="AUTO_ELIGIBLE">자동 게시 가능(분류)</option>
            <option value="PUBLISHED">게시 중</option>
            <option value="EXPIRED">만료됨</option>
            <option value="REJECTED">폐기됨</option>
            <option value="RETIRED">종료됨</option>
          </select>
        </label>
        <label class="sc-admin-daily-issue-field">
          <span>카테고리</span>
          <select id="sc-admin-daily-issue-filter-category" aria-label="카테고리 필터">
            <option value="">전체</option>
            <option value="world">국제</option>
            <option value="korea-economy">한국 경제</option>
            <option value="korea-policy">한국 정책</option>
            <option value="society">사회</option>
            <option value="tech">기술</option>
            <option value="other">기타</option>
          </select>
        </label>
        <label class="sc-admin-daily-issue-field">
          <span>큐</span>
          <select id="sc-admin-daily-issue-filter-queue" aria-label="검수 큐 필터">
            <option value="">전체</option>
            <option value="pending-approval">승인대기</option>
            <option value="manual-review">관리자 검수</option>
            <option value="post-review">자동 게시 사후 검수</option>
          </select>
        </label>
        <label class="sc-admin-daily-issue-field">
          <span>개수</span>
          <select id="sc-admin-daily-issue-filter-limit" aria-label="목록 개수">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-refresh">새로고침</button>
        <button type="button" class="sc-admin-daily-issue-btn sc-admin-daily-issue-btn-ghost" id="sc-admin-daily-issue-logout">로그아웃</button>
      </div>
    </header>

    <div id="sc-admin-daily-issue-banner" class="sc-admin-daily-issue-banner" role="status" aria-live="polite"></div>

    <section id="sc-admin-daily-issue-morning" class="sc-admin-daily-issue-morning" aria-label="아침판 운영 상태">
      <div class="sc-admin-daily-issue-morning-head">
        <h2>아침판 운영</h2>
        <div class="sc-admin-daily-issue-morning-actions">
          <button type="button" class="sc-admin-daily-issue-btn sc-admin-daily-issue-btn-ghost" id="sc-admin-daily-issue-morning-refresh">상태 새로고침</button>
          <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-morning-collect">수동 수집</button>
          <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-morning-publish">만료·예약 처리</button>
        </div>
      </div>
      <div id="sc-admin-daily-issue-morning-alerts" class="sc-admin-daily-issue-morning-alerts" role="alert"></div>
      <dl id="sc-admin-daily-issue-morning-status" class="sc-admin-daily-issue-kv sc-admin-daily-issue-morning-kv"></dl>
    </section>

    <main id="sc-admin-daily-issue-main" class="sc-admin-daily-issue-layout">
      <section class="sc-admin-daily-issue-panel sc-admin-daily-issue-list-panel" aria-label="검수 목록">
        <div class="sc-admin-daily-issue-panel-head">
          <h2>목록</h2>
          <span id="sc-admin-daily-issue-list-meta" class="sc-admin-daily-issue-meta"></span>
        </div>
        <div id="sc-admin-daily-issue-list-loading" class="sc-admin-daily-issue-loading" hidden>불러오는 중…</div>
        <div id="sc-admin-daily-issue-list-empty" class="sc-admin-daily-issue-empty" hidden>검수 후보가 없습니다.</div>
        <ul id="sc-admin-daily-issue-list" class="sc-admin-daily-issue-list" role="listbox" aria-label="검수 후보"></ul>
        <div class="sc-admin-daily-issue-pager">
          <button type="button" class="sc-admin-daily-issue-btn sc-admin-daily-issue-btn-ghost" id="sc-admin-daily-issue-more" hidden>더보기</button>
        </div>
      </section>

      <section class="sc-admin-daily-issue-panel sc-admin-daily-issue-detail-panel" aria-label="검수 상세">
        <div class="sc-admin-daily-issue-panel-head">
          <h2>상세</h2>
          <div id="sc-admin-daily-issue-actions" class="sc-admin-daily-issue-actions"></div>
        </div>
        <div id="sc-admin-daily-issue-detail-empty" class="sc-admin-daily-issue-empty">왼쪽에서 항목을 선택하세요.</div>
        <div id="sc-admin-daily-issue-detail" class="sc-admin-daily-issue-detail" hidden></div>
      </section>
    </main>
  </div>

  <!-- Login modal -->
  <div id="sc-admin-daily-issue-login-modal" class="sc-admin-daily-issue-modal" role="dialog" aria-modal="true" aria-labelledby="sc-admin-daily-issue-login-title">
    <div class="sc-admin-daily-issue-modal-card">
      <h2 id="sc-admin-daily-issue-login-title">관리자 로그인</h2>
      <p class="sc-admin-daily-issue-help">Supabase 이메일·비밀번호 로그인 후 ADMIN/OWNER 권한만 접근할 수 있습니다.</p>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block">
        <span>이메일</span>
        <input type="email" id="sc-admin-daily-issue-login-email" autocomplete="username" spellcheck="false" />
      </label>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block">
        <span>비밀번호</span>
        <input type="password" id="sc-admin-daily-issue-login-password" autocomplete="current-password" spellcheck="false" />
      </label>
      <p id="sc-admin-daily-issue-login-error" class="sc-admin-daily-issue-error" role="alert" aria-live="assertive"></p>
      <div class="sc-admin-daily-issue-modal-actions">
        <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-login-submit">로그인</button>
      </div>
    </div>
  </div>

  <!-- Reason modal -->
  <div id="sc-admin-daily-issue-reason-modal" class="sc-admin-daily-issue-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sc-admin-daily-issue-reason-title">
    <div class="sc-admin-daily-issue-modal-card">
      <h2 id="sc-admin-daily-issue-reason-title">사유 입력</h2>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block">
        <span>reasonCode</span>
        <select id="sc-admin-daily-issue-reason-code"></select>
      </label>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block">
        <span>reasonText</span>
        <textarea id="sc-admin-daily-issue-reason-text" maxlength="500" rows="3"></textarea>
      </label>
      <p id="sc-admin-daily-issue-reason-error" class="sc-admin-daily-issue-error" role="alert"></p>
      <div class="sc-admin-daily-issue-modal-actions">
        <button type="button" class="sc-admin-daily-issue-btn sc-admin-daily-issue-btn-ghost" id="sc-admin-daily-issue-reason-cancel">취소</button>
        <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-reason-submit">확인</button>
      </div>
    </div>
  </div>

  <!-- Revalidate modal -->
  <div id="sc-admin-daily-issue-reval-modal" class="sc-admin-daily-issue-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sc-admin-daily-issue-reval-title">
    <div class="sc-admin-daily-issue-modal-card">
      <h2 id="sc-admin-daily-issue-reval-title">재검증 결과</h2>
      <div id="sc-admin-daily-issue-reval-body" class="sc-admin-daily-issue-reval-body"></div>
      <p class="sc-admin-daily-issue-help">재검증만 수행합니다. 자동 승인·게시하지 않습니다.</p>
      <div class="sc-admin-daily-issue-modal-actions">
        <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-reval-close">닫기</button>
      </div>
    </div>
  </div>

  <div id="sc-admin-daily-issue-ops-modal" class="sc-admin-daily-issue-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sc-admin-daily-issue-ops-title">
    <div class="sc-admin-daily-issue-modal-card">
      <h2 id="sc-admin-daily-issue-ops-title">운영 지시</h2>
      <p id="sc-admin-daily-issue-ops-help" class="sc-admin-daily-issue-help">승인 전에는 공개되지 않습니다.</p>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block" id="sc-admin-daily-issue-ops-delay-wrap" hidden>
        <span>다시 취합 시각</span>
        <select id="sc-admin-daily-issue-ops-delay">
          <option value="30">30분 후</option>
          <option value="60">1시간 후</option>
          <option value="120">2시간 후</option>
          <option value="240">4시간 후</option>
          <option value="custom">직접 지정</option>
        </select>
      </label>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block" id="sc-admin-daily-issue-ops-custom-wrap" hidden>
        <span>분</span>
        <input type="number" id="sc-admin-daily-issue-ops-custom" min="1" max="1440" value="90" />
      </label>
      <label class="sc-admin-daily-issue-field sc-admin-daily-issue-field-block">
        <span>수정 지시 (선택)</span>
        <textarea id="sc-admin-daily-issue-ops-instruction" maxlength="2000" rows="4" placeholder="예: 양측 입장을 더 균형 있게 정리해라"></textarea>
      </label>
      <p id="sc-admin-daily-issue-ops-error" class="sc-admin-daily-issue-error" role="alert"></p>
      <div class="sc-admin-daily-issue-modal-actions">
        <button type="button" class="sc-admin-daily-issue-btn sc-admin-daily-issue-btn-ghost" id="sc-admin-daily-issue-ops-cancel">취소</button>
        <button type="button" class="sc-admin-daily-issue-btn" id="sc-admin-daily-issue-ops-submit">실행</button>
      </div>
    </div>
  </div>

  <script src="/admin/admin-shell.js"></script>
  <script src="/admin/daily-issues/admin-daily-issue.js"></script>
</body>
</html>
